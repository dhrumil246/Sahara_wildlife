<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHARA Live Testing Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
/* Foreground layer of live-testing.mp4, same look as overlay.html. One layout:
   the footage card sits under the title; step captions sit on the footage.
   Deterministic: renderAt(t) paints edit time t. */
:root { --ink: #0E1422; --dim: #667085; --orange: #F97316; --orange-d: #EA580C; --mono: "JetBrains Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.mask { overflow: hidden; padding: 0 .06em .1em; margin: 0 -.06em; }
.num { font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .16em; color: var(--orange-d); display: flex; align-items: center; gap: 12px; }
.num i { width: 34px; height: 2px; background: var(--orange); display: inline-block; }
.title { font-weight: 800; letter-spacing: -.045em; line-height: 1.02; }
.sub { color: var(--dim); font-weight: 500; letter-spacing: -.01em; line-height: 1.35; }
.badge { display: inline-flex; align-items: center; gap: 9px; height: 38px; padding: 0 16px; border-radius: 999px; background: #fff; border: 1px solid rgba(14,20,34,.08); box-shadow: 0 6px 16px -8px rgba(14,20,34,.25); font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.badge .d { width: 9px; height: 9px; border-radius: 50%; }
.cap { position: absolute; left: 272px; bottom: 82px; display: flex; gap: 16px; align-items: center; padding: 16px 24px 16px 18px; border-radius: 16px; background: rgba(255,255,255,.96); box-shadow: 0 14px 34px -12px rgba(0,0,0,.45); }
.cap .bar { width: 5px; align-self: stretch; border-radius: 3px; }
.cap .k { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.cap .v { font-size: 26px; font-weight: 650; letter-spacing: -.015em; margin-top: 4px; }
.slab { position: absolute; top: -40px; height: 1160px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="paper" class="abs" width="1920" height="1080" style="left:0;top:0">
    <defs>
      <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse" x="18" y="18"><circle cx="1.5" cy="1.5" r="1.4" fill="rgba(14,20,34,.07)"/></pattern>
      <radialGradient id="glowO" cx="92%" cy="-8%" r="55%"><stop offset="0" stop-color="#F97316" stop-opacity=".08"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowB" cx="0%" cy="110%" r="55%"><stop offset="0" stop-color="#2563EB" stop-opacity=".06"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
      <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="#fff"/><rect x="240" y="200" width="1440" height="810" rx="22" fill="#000"/></mask>
    </defs>
    <g mask="url(#holes)">
      <rect width="1920" height="1080" fill="#F4F3EF"/><rect width="1920" height="1080" fill="url(#dots)"/>
      <rect width="1920" height="1080" fill="url(#glowO)"/><rect width="1920" height="1080" fill="url(#glowB)"/>
      <rect x="240" y="218" width="1440" height="810" rx="22" fill="rgba(14,20,34,.30)" filter="url(#blur)"/>
    </g>
    <rect x="239.5" y="199.5" width="1441" height="811" rx="22" fill="none" stroke="rgba(14,20,34,.10)"/>
  </svg>
  <div id="segLayer"></div>
  <svg id="marker" class="abs" width="1920" height="1080" style="left:0;top:0;display:none"></svg>
  <div class="abs" id="progress" style="left:0;bottom:0;height:5px;width:0;background:#16A34A"></div>
  <div class="slab" id="slabA" style="width:2600px;background:#F97316;display:none"></div>
  <div class="slab" id="slabB" style="width:120px;background:#0E1422;display:none"></div>
</div>
<script>
const W = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutQuart: t => t < .5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2,
  outBack: t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const P = (t, a, b, e = E.outExpo) => e(clamp((t - a) / (b - a)));
const $ = id => document.getElementById(id);

/* Footage card: every clip is 16:9 and fills this rectangle. */
const CARD = [240, 200, 1440, 810];
const WA_W = 1024;                       // WhatsApp clip width; card scale = 1440 / 1024
const BOX = [478, 197];                  // cardboard box in the WhatsApp frame at 30.10 s
const toCard = ([x, y]) => [CARD[0] + x * CARD[2] / WA_W, CARD[1] + y * CARD[2] / WA_W];

/* ---------------- the edit ----------------
   src: "ay" (team film, 4K) or "wa" (payload-drop phone clip). a..b source
   seconds, dur edit seconds. still: hold one frame. zoom: [x, y, w, h] crop of
   the source frame (in source pixels) before scaling to the card.
   beats: [source second, colour, label, caption]. */
const G = "#16A34A", O = "#F97316", K = "#0E1422", R = "#DC2626";
const SEGS = [
  { src: "ay", a: 12.5, b: 18.5, dur: 6.0, n: "01", title: "First test flights", sub: "Our S500 quadcopter, flown by our pilot on the RC controller",
    beats: [[12.5, K, "Test", "No-payload test flight"], [15.0, G, "Take-off", "Lifts off from the grass"]] },
  { src: "ay", a: 19.0, b: 23.0, dur: 4.0, n: "01", title: "First test flights", sub: "Our S500 quadcopter, flown by our pilot on the RC controller", cont: true,
    beats: [[19.0, G, "In the air", "Stable flight, passing overhead"]] },
  { src: "ay", a: 33.0, b: 38.0, dur: 5.0, n: "02", title: "Payload test: steel bottle", sub: "Carrying weight under the drone",
    beats: [[33.0, K, "Setup", "A steel bottle hangs below the drone"], [35.0, G, "Take-off", "Lifts off with the payload"]] },
  { src: "ay", a: 38.0, b: 54.0, dur: 10.0, n: "02", title: "Payload test: steel bottle", sub: "Carrying weight under the drone", cont: true,
    beats: [[38.0, G, "In flight", "Flying with the payload attached"]] },
  { src: "ay", a: 55.5, b: 59.5, dur: 4.0, n: "03", title: "Safe landing", sub: "Back on the ground with the team",
    beats: [[55.5, G, "Landing", "Coming in to land"], [58.0, G, "Landed", "Back on the ground, safely"]] },
  { src: "wa", a: 14.0, b: 21.0, dur: 7.0, n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller",
    beats: [[14.0, K, "Setup", "A cardboard box is tied under the drone"], [16.5, G, "Take-off", "Lifts off with the box"]] },
  { src: "wa", a: 21.0, b: 28.8, dur: 3.9, n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller", cont: true,
    beats: [[21.0, G, "Climbing", "Climbing with the payload"]] },
  { src: "wa", a: 28.8, b: 30.1, dur: 1.3, n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller", cont: true,
    beats: [[28.8, G, "Climbing", "Climbing with the payload"]] },
  { id: "freeze", src: "wa", still: 30.1, dur: 3.5, n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller", cont: true,
    beats: [[0, R, "Payload released", "Dropped on command from the pilot's RC controller"]] },
  { src: "wa", a: 30.1, b: 32.0, dur: 1.9, n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller", cont: true,
    beats: [[30.1, R, "Payload released", "The box falls away — the drone flies on"]] },
  { id: "replay", src: "wa", a: 29.5, b: 31.2, dur: 5.0, zoom: [219, 36, 512, 288], n: "04", title: "Payload drop test", sub: "A cardboard box, released in flight from the pilot's RC controller", cont: true,
    beats: [[29.5, O, "Replay · 2× zoom", "The moment of release"]] },
];
let acc = 0;
SEGS.forEach(s => {
  s.t0 = acc; acc += s.dur; s.t1 = acc;
  s.speed = s.still !== undefined ? 0 : (s.b - s.a) / s.dur;
  s.cues = s.beats.map(([st, col, k, v]) => ({ lt: s.still !== undefined ? .15 : Math.max(0, (st - s.a) / s.speed), col, k, v }));
});
const DURATION = acc;
const WIPES = [0];

const layer = $("segLayer");
const speedLabel = s => s.still !== undefined ? "FREEZE FRAME" : s.speed > 1.25 ? `${+s.speed.toFixed(1)}× SPEED` : s.speed < .9 ? "SLOW MOTION" : "REAL TIME";
SEGS.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = "abs"; el.style.inset = "0"; el.style.display = "none";
  el.innerHTML = `
    <div class="abs" style="left:240px;top:54px;width:1000px">
      <div class="num" data-num>${s.n}<i></i></div>
      <div class="mask" style="margin-top:8px"><div class="title" data-title style="font-size:52px">${s.title}</div></div>
      <div class="sub" data-sub style="font-size:22px;margin-top:6px">${s.sub}</div></div>
    <div class="abs" data-badges style="right:240px;top:72px;display:flex;gap:10px">
      <span class="badge"><span class="d" style="background:#16A34A"></span>REAL DRONE</span>
      <span class="badge"><span class="d" style="background:#F97316"></span>RC PILOT</span>
      <span class="badge"><span class="d" style="background:#0E1422"></span>${speedLabel(s)}</span></div>
    ${s.cues.map((c, q) => `<div class="cap" data-cue="${q}" style="display:none"><div class="bar" style="background:${c.col}"></div>
      <div><div class="k" style="color:${c.col}">${c.k}</div><div class="v">${c.v}</div></div></div>`).join("")}`;
  layer.appendChild(el);
  s.el = el;
});

function renderAt(t) {
  const s = SEGS.find(q => t >= q.t0 && t < q.t1) || SEGS[SEGS.length - 1];
  SEGS.forEach(q => q.el.style.display = q === s ? "block" : "none");
  const lt = t - s.t0, el = s.el;
  // title: animate only when the chapter changes
  const tIn = s.cont ? -10 : 0;
  const pt = P(lt, tIn + .05, tIn + .65, E.outExpo);
  el.querySelector("[data-title]").style.transform = `translateY(${(1 - pt) * 115}%)`;
  const pn = P(lt, tIn, tIn + .4); el.querySelector("[data-num]").style.opacity = pn;
  const ps = P(lt, tIn + .25, tIn + .75, E.outCubic); el.querySelector("[data-sub]").style.opacity = ps;
  el.querySelector("[data-badges]").style.opacity = P(lt, tIn + .3, tIn + .8, E.outCubic);
  // captions: newest one only
  let cur = -1; s.cues.forEach((c, q) => { if (lt >= c.lt) cur = q; });
  el.querySelectorAll("[data-cue]").forEach(f => {
    const q = +f.dataset.cue;
    if (q !== cur) { f.style.display = "none"; return; }
    const c = s.cues[q], fresh = !(s.cont && q === 0 && c.v === prevCaption(s));
    const p = fresh ? P(lt, c.lt, c.lt + .45, E.outBack) : 1, pf = fresh ? P(lt, c.lt, c.lt + .2) : 1;
    f.style.display = "flex"; f.style.opacity = pf; f.style.transform = `translateY(${(1 - p) * 24}px)`;
  });
  // drop marker on the freeze frame
  const mk = $("marker");
  if (s.id === "freeze") {
    const [x, y] = toCard(BOX), p = P(lt, .1, .6, E.outBack), pulse = (lt * 1.2) % 1;
    mk.style.display = "block";
    mk.innerHTML = `
      <circle cx="${x}" cy="${y}" r="${46 + pulse * 40}" fill="none" stroke="#DC2626" stroke-width="3" opacity="${(1 - pulse) * .8}"/>
      <circle cx="${x}" cy="${y}" r="${40 * p}" fill="none" stroke="#fff" stroke-width="7"/>
      <circle cx="${x}" cy="${y}" r="${40 * p}" fill="none" stroke="#DC2626" stroke-width="4"/>
      <g opacity="${P(lt, .45, .8)}">
        <path d="M${x + 44} ${y - 8} L${x + 150} ${y - 90} H${x + 190}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M${x + 44} ${y - 8} L${x + 150} ${y - 90} H${x + 190}" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="${x + 190}" y="${y - 132}" width="372" height="84" rx="14" fill="#DC2626"/>
        <text x="${x + 210}" y="${y - 98}" font-family="JetBrains Mono" font-weight="700" font-size="15" letter-spacing="2" fill="#fff" opacity=".85">PAYLOAD RELEASED</text>
        <text x="${x + 210}" y="${y - 68}" font-family="Inter" font-weight="700" font-size="23" fill="#fff">Cardboard box · mid-air</text></g>`;
  } else mk.style.display = "none";
  // footage progress
  $("progress").style.width = clamp(t / DURATION) * 1920 + "px";
  // opening wipe (continues from the demo's Live Testing card)
  const A = $("slabA"), B = $("slabB"); let on = false;
  for (const tc of WIPES) {
    if (t < tc - .3 || t > tc + .3) continue;
    const p = E.inOutQuart(clamp((t - (tc - .3)) / .6)), x = lerp(W + 420, -2600 - 420, p);
    A.style.transform = `translateX(${x}px) skewX(-14deg)`; B.style.transform = `translateX(${x - 150}px) skewX(-14deg)`; on = true;
  }
  A.style.display = B.style.display = on ? "block" : "none";
}
function prevCaption(s) {
  const i = SEGS.indexOf(s); if (i < 1) return null;
  const p = SEGS[i - 1]; return p.cues[p.cues.length - 1].v;
}
function sfxEvents() {
  const ev = [], add = (t, type, v = 1) => ev.push({ t: +t.toFixed(3), type, v });
  add(0, "whoosh", 1);
  SEGS.forEach(s => {
    if (!s.cont) add(s.t0 + .05, "tick", .7);
    s.cues.forEach((c, q) => { if (!(s.cont && q === 0 && c.v === prevCaption(s))) add(s.t0 + c.lt, "pop", .6); });
  });
  const fz = SEGS.find(s => s.id === "freeze"), rp = SEGS.find(s => s.id === "replay");
  add(fz.t0, "impact", 1.0); add(fz.t0 + .1, "thud", 1.0);
  add(rp.t0, "swish", .8);
  add(rp.t0 + (30.1 - rp.a) / rp.speed, "thud", .9);
  return ev.sort((a, b) => a.t - b.t);
}
window.EDIT = { cut: "live", card: CARD, segs: SEGS.map(({ el, ...s }) => s), duration: DURATION };
window.sfxEvents = sfxEvents;
window.ready = (async () => {
  await Promise.all([500, 600, 700, 800].map(w => document.fonts.load(`${w} 40px Inter`)));
  await Promise.all([600, 700].map(w => document.fonts.load(`${w} 20px "JetBrains Mono"`)));
  await document.fonts.ready;
  window.renderAt = renderAt;
  renderAt(parseFloat(new URLSearchParams(location.search).get("t") || "0"));
  return true;
})();
</script>
</body>
</html>
